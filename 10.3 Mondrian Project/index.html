<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mondrian Project</title>
  <style>
  
    /* 
    Write your CSS here 
    Gap Colour: #000
    White: #F0F1EC
    Red: #E72F24
    Black: #232629
    Blue: #004592
    Yellow: #F9D01E

    For dimensions, see dimensions.png image.
    HINT: Remember you can't change the properties of grid lines.
    But grid lines are transparent!
    */
    .main-container{
      display: flex;
      width: 748px;
      height: 746px;
      background-color: black;

    }
    .grid-container{
      display: grid;
      grid-template-rows: 414px 130px 155px 20px ;
      grid-template-columns: 320px 198px 153px 50px;
      gap: 9px;
    }
    .item{
      background-color: #F0F1EC;
    }
    .first{
      background-color: #E72F24;
    }
    .second {
      grid-column: span 3;
    }
    .third{
      grid-row: span 2;
    }
    .fourth{
      grid-column : span 2;
      grid-row: span 2;
    }
    .fifth{
      background-color: #004592;
      border-bottom: 10px solid;
    }
    .sixth{
      
      grid-row: span 2 ; 
      }
    .eighth{
      background-color: #F9D01E;
    }
    .ninth{
      background-color:#232629;
    }
  </style>
</head>

<body>
  <!-- Write your HTML here -->
   <div class="main-container ">
    <div class="grid-container">
      <div class="first item"></div>
      <div class="second item"></div>
      <div class="third item"></div>
      <div class="fourth item"></div>
      <div class="fifth item"></div>
      <div class="sixth item"></div>
      <div class="seventh item"></div>
      <div class="eighth item"></div>
      <div class="ninth item"></div>
    </div>
   </div>
</body>

</html>
